name: 构建并发布桌面版

# 推送 v 开头的 tag（如 v1.0.0）时，自动构建三平台安装包并发布到 GitHub Releases
# 也支持在 Actions 页面手动触发（workflow_dispatch）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（仅手动触发时使用，例如 1.0.0）'
        required: true
        default: '1.0.0'

jobs:
  build:
    name: 构建 ${{ matrix.os-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: windows
            target: '--win nsis --x64'
          - os: macos-latest
            os-name: macos
            target: '--mac dmg --x64 --arm64'
          - os: ubuntu-latest
            os-name: linux
            target: '--linux AppImage deb --x64'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装依赖
        working-directory: desktop
        # 跳过 install 脚本：electron 二进制改由下一步带重试地下载，避免 GitHub 偶发 500 导致整步失败
        run: npm ci --ignore-scripts

      - name: 确保 Electron 二进制就位
        working-directory: desktop
        shell: bash
        run: |
          n=0
          until [ $n -ge 3 ]; do
            node node_modules/electron/install.js && break
            n=$((n+1))
            echo "::warning::Electron 二进制下载失败，10 秒后重试（第 $n 次）"
            sleep 10
          done
          if [ $n -ge 3 ]; then echo "::error::Electron 二进制 3 次下载均失败"; exit 1; fi

      - name: 配置 Electron 沙箱权限（仅 Linux）
        if: matrix.os-name == 'linux'
        working-directory: desktop
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: 路径替换自检
        working-directory: desktop
        # Linux 无图形界面，用 xvfb 虚拟显示运行 Electron
        run: ${{ matrix.os-name == 'linux' && 'xvfb-run -a npm run selfcheck' || 'npm run selfcheck' }}

      - name: 打包（${{ matrix.os-name }}）
        working-directory: desktop
        # --publish never：只构建产物；上传发布统一由 release job 的 softprops 完成
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os-name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部安装包
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lhR artifacts

      - name: 创建 Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          # 手动触发时没有 tag，用输入的版本号创建 tag；tag 推送时自动使用该 tag
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          name: Java 学习中心 ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          body: |
            > 本版本的具体改动见下方「变更记录」（由该版本包含的提交自动生成）。
            > 桌面版已支持应用内自动更新：新版本安装包会在后台静默下载，完成后启动应用时弹窗提醒，可选择立即安装、稍后或忽略该版本。

            ## 📦 安装包说明

            | 平台 | 文件 | 安装方式 |
            |------|------|---------|
            | Windows 10/11（64 位） | `JavaLearningCenter-Setup-*.exe` | 双击安装（SmartScreen 提示点「更多信息 → 仍要运行」） |
            | macOS（M 系列芯片） | `JavaLearningCenter-*-arm64.dmg` | 拖入「应用程序」 |
            | macOS（Intel 芯片） | `JavaLearningCenter-*-x64.dmg` | 拖入「应用程序」 |
            | Linux（Debian/Ubuntu） | `JavaLearningCenter-*-amd64.deb` | `sudo dpkg -i 文件名` |
            | Linux（通用） | `JavaLearningCenter-*-x86_64.AppImage` | `chmod +x` 后直接运行 |

            > 安装包已内置全部课程与 55 个练习模板，首次启动会自动在「文档」目录创建你的代码工作区。
            > 下载时浏览器若提示「通常不会下载此文件」，点「··· → 保留 → 仍然保留」即可（因未购买代码签名证书，详见仓库 [下载安装指南](https://github.com/Shao-qichao/learn/blob/main/docs/下载安装指南.md)）。

            ## ☕ 写代码前还需安装

            桌面软件自带课程内容，但**编译运行 Java 代码**还需要以下两样：

            | 软件 | 是否必装 | 下载地址 | 安装要点 |
            |------|---------|---------|---------|
            | **JDK 11 / 17 / 21**（任选其一，推荐 11） | ✅ 必装 | https://adoptium.net/temurin/releases/?version=11 | Windows 选 `.msi`；安装时勾选 **Set JAVA_HOME** 和 **Add to PATH** |
            | **VS Code** | 强烈推荐 | https://code.visualstudio.com/Download | 课程内「用 VS Code 打开」按钮需要它 |

            - JDK 各版本对比与常见问题见 [新用户操作指南](https://github.com/Shao-qichao/learn/blob/main/java-course-site/新用户操作指南.md) 第 3.2 节
            - 懒人一键装齐 Git + JDK + VS Code：克隆仓库后运行 `java-course-site/tools/setup-windows.ps1`（Windows）或 `setup-mac-linux.sh`（macOS/Linux）

            ### JDK 环境变量配置

            **Windows**（`.msi` 安装时勾选了 Set JAVA_HOME / Add to PATH 则自动配好，无需以下步骤）：

            1. `Win + R` 输入 `sysdm.cpl` → **高级** → **环境变量**
            2. 系统变量 **新建**：`JAVA_HOME` = JDK 安装目录（如 `C:\Program Files\Eclipse Adoptium\jdk-11.0.28+6`）
            3. 编辑 `Path` → **新建** `%JAVA_HOME%\bin` → 确定
            4. **重新打开**终端，`java -version` 有输出即成功

            **macOS**：`.pkg` 自动配置；手动版在 `~/.zshrc` 加 `export JAVA_HOME=$(/usr/libexec/java_home)` 和 `export PATH=$JAVA_HOME/bin:$PATH`，再 `source ~/.zshrc`

            **Linux**：包管理器安装自动配置；手动解压版在 `~/.bashrc` 加 `export JAVA_HOME=/opt/jdk-11` 和 `export PATH=$JAVA_HOME/bin:$PATH`，再 `source ~/.bashrc`

            ## 🗝️ 章节解锁口令

            | 章 | 口令 | 章 | 口令 |
            |----|------|----|------|
            | 1→2 | COFFEE-02 | 6→7 | EXTEND-0707 |
            | 2→3 | LOOP-0303 | 7→8 | FINAL-0808 |
            | 3→4 | ARRAY-0404 | 8→9 | DSALGO-09 |
            | 4→5 | METHOD-0505 | 9→10 | MUSIC-10 |
            | 5→6 | OBJECT-0606 | | |
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.zip
            artifacts/*.blockmap
            artifacts/latest*.yml
